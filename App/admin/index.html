<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OGEIDA — لوحة الأدمن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:dark;--bg:#0a0a0a;--card:#14130f;--tx:#f6f1e3;--mut:#a39d8c;--bd:#3d3217;--pri:#fcd34d;--pri2:#f59e0b;--gold:#fcd34d;--cold:#38bdf8;--warm:#fbbf24;--hot:#f43f5e;--sh:0 4px 20px rgba(40,40,100,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--card:#14130f;--tx:#f6f1e3;--mut:#a39d8c;--bd:#3d3217;--pri:#fcd34d;--sh:0 4px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0a0a0a;--card:#14130f;--tx:#f6f1e3;--mut:#a39d8c;--bd:#3d3217;--pri:#fcd34d;--sh:0 4px 20px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,system-ui,sans-serif;font-size:14px}
.wrap{max-width:1000px;margin:auto;padding:14px 14px 96px}
.top{background:radial-gradient(120% 140% at 85% 0%,rgba(252,211,77,.2),transparent 60%),var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);margin-bottom:14px}
.top h1{margin:0;font-size:19px;flex:1}.top small{opacity:.85;display:block;font-weight:400;font-size:12px}
.badge{background:var(--gold);color:#093534;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--bd);border-radius:26px 26px 0 0;overflow-x:auto}
.tab{border:0;background:transparent;color:var(--mut);padding:8px 6px;border-radius:0;font:inherit;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:none;border-bottom:3px solid transparent}
.tab.on{background:transparent;color:var(--gold);border-bottom-color:var(--gold)}
.card{background:linear-gradient(160deg,#1c1911,var(--card));border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--bd)}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);border:1px solid var(--bd);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,var(--gold))}
.kpi b{font-size:26px;display:block}.kpi span{color:var(--mut);font-size:12px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;max-width:100%}
button{cursor:pointer}.btn{background:var(--gold);color:#1a1400;border:0;font-weight:700;border-radius:99px;padding:10px 18px}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
textarea{width:100%;min-height:80px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
.t{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.cold{background:var(--cold)}.warm{background:var(--warm);color:#4a3200}.hot{background:var(--hot)}.none{background:var(--mut)}
.lead{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bd);display:grid;gap:8px}
.lead .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two>*{width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:8px 4px;font-size:12px;font-weight:600}
.seg button.on[data-v=cold]{background:var(--cold);color:#fff}.seg button.on[data-v=warm]{background:var(--warm);color:#4a3200}.seg button.on[data-v=hot]{background:var(--hot);color:#fff}.seg button.on[data-v=""]{background:var(--pri);color:#1a1400}
.m{color:var(--mut)}@keyframes ring{0%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(-14deg)}20%,40%,60%{transform:rotate(14deg)}70%{transform:rotate(0)}}.ring{display:inline-block;animation:ring 1.4s infinite;transform-origin:50% 20%}.mood{font-size:30px;line-height:1;display:inline-block}@keyframes shiv{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}.shiv{animation:shiv .25s infinite}@keyframes pul{50%{transform:scale(1.18)}}.pul{animation:pul 1s infinite}.av{display:inline-block}.av svg{width:54px;height:54px;display:block}@keyframes bob{50%{transform:translateY(-3px)}}.think{animation:bob 2s infinite}details summary{cursor:pointer;padding:4px 0}
.avb{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:var(--card);color:var(--gold);padding:0;overflow:hidden;display:grid;place-items:center;font:inherit;font-weight:700;cursor:pointer}.avb img,.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pv{width:110px;height:110px;border-radius:50%;border:3px solid var(--gold);margin:auto;overflow:hidden;display:grid;place-items:center;font-size:44px;color:var(--gold);background:var(--bg)}
.cvw{width:min(280px,100%);aspect-ratio:1;border-radius:50%;overflow:hidden;margin:auto;border:3px solid var(--gold);touch-action:none}.cvw canvas{width:100%;height:100%;display:block;cursor:grab}
.av svg{border-radius:50%}.pvw{width:92px;height:62px;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}.pvw svg{width:100%;height:100%;display:block}
.stg{display:flex;gap:4px;margin:10px 0;overflow-x:auto}.stg button{flex:1;min-width:52px;padding:6px 4px;font-size:11px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--mut)}.stg .done{background:#14532d;color:#bbf7d0;border-color:#166534}.stg .cur{background:var(--gold);color:#1a1400;border-color:var(--gold);font-weight:700}
.pbar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,var(--gold))}
.alm{border:1px dashed var(--bd);border-radius:12px;padding:8px}
.dm{position:relative;border-color:var(--gold);background:linear-gradient(135deg,#2a2208,var(--card))}.dmt{font-size:17px;font-weight:700;line-height:1.7;margin-top:4px;color:var(--gold)}.dmx{position:absolute;top:8px;left:8px;padding:2px 8px}
.scs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.hc{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--bd);border-top:4px solid var(--c);min-height:150px;background:#14130f}.hc.full{grid-column:1/-1;min-height:172px}
.hc .art{position:absolute;inset:0}.hc .art img,.hc .art svg{width:100%;height:100%;object-fit:cover;display:block}
.hc:after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(10,10,10,.92),rgba(10,10,10,.5) 45%,transparent 78%)}
.hc .tx{position:relative;z-index:1;padding:12px 14px}.hc .en{font-size:22px;font-weight:700;color:var(--c);line-height:1.1}.hc .ar{font-size:13px;color:var(--tx)}.hc .tx b{display:block;font-size:34px;color:#fff;margin-top:4px;line-height:1.1}.hc .sub{color:var(--mut);font-size:13px}
.hc .gen{position:absolute;z-index:2;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:var(--gold);padding:3px 10px;border-radius:99px;font-size:12px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spn 1s linear infinite;vertical-align:-2px}@keyframes spn{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mut);padding:30px}
a{color:var(--pri);text-decoration:none;font-weight:600}

/* ===== Mobile refinement: admin UI only; desktop styles remain unchanged ===== */
@media (max-width: 700px) {
  html { -webkit-text-size-adjust: 100%; }
  body { font-size: 14px; }
  .wrap { width: 100%; max-width: 100%; padding: 10px 10px calc(92px + env(safe-area-inset-bottom,0px)); }
  .top {
    padding: 11px 12px; border-radius: 16px; gap: 8px;
    flex-wrap: wrap; margin-bottom: 10px;
  }
  .top h1 { min-width: 0; flex: 1 1 100%; font-size: 17px; line-height: 1.35; }
  .top h1 small { font-size: 11px; }
  .top .badge { padding: 6px 10px; font-size: 11px; }
  .top .avb { width: 38px; height: 38px; flex: 0 0 38px; }
  .card { padding: 12px; border-radius: 16px; margin-bottom: 10px; }
  .card h3 { font-size: 14px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi { min-width: 0; padding: 11px; border-radius: 13px; }
  .kpi b { font-size: 22px; }
  .kpi span { font-size: 11px; line-height: 1.45; display: block; }
  .scs { grid-template-columns: 1fr; gap: 9px; }
  .hc, .hc.full { min-height: 132px; grid-column: auto; }
  .hc .en { font-size: 19px; }
  .hc .tx b { font-size: 29px; }
  .row { gap: 7px; }
  .row > button, .row > .btn, .row > a.btn { min-height: 40px; }
  button, select, input, textarea { font-size: 14px; }
  input, select { min-height: 42px; }
  textarea { min-height: 96px; }
  .two { grid-template-columns: 1fr; gap: 8px; }
  .seg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .seg button { min-height: 40px; }
  .lead { padding: 11px; gap: 9px; }
  .lead .h { align-items: flex-start; flex-wrap: wrap; }
  .lead .h > .row { flex-wrap: wrap; }
  .sc { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { min-width: 680px; }
  th, td { padding: 9px 8px; }
  .tabs {
    left: 0; right: 0; bottom: 0; width: 100%;
    justify-content: flex-start; gap: 4px;
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom,0px));
    border-radius: 16px 16px 0 0;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; min-width: max-content; padding: 9px 12px; font-size: 12px; }
  .tab.on { border-bottom-width: 3px; }
  #adminLeadModal, #teamRoleModal {
    padding: 8px !important;
    align-items: end !important;
  }
  #adminLeadModal > .card, #teamRoleModal > .card {
    width: 100% !important; max-height: 88dvh !important;
    border-radius: 18px 18px 10px 10px;
    overflow: auto; overscroll-behavior: contain;
  }
  .pv { width: 92px; height: 92px; }
  .cvw { width: min(250px, 100%); }
  .empty { padding: 22px 12px; }
}
@media (max-width: 380px) {
  .wrap { padding-left: 8px; padding-right: 8px; }
  .top { gap: 6px; }
  .top h1 { font-size: 15px; }
  .grid { gap: 6px; }
  .kpi { padding: 9px; }
  .kpi b { font-size: 20px; }
  .tab { padding: 8px 10px; font-size: 11px; }
  .row > button, .row > .btn, .row > a.btn { padding-left: 11px; padding-right: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  .ring, .shiv, .pul, .think { animation: none !important; }
}

</style>

<body>
<div class="wrap">
  <div class="top"><h1 style="letter-spacing:1px">OGEIDA <span style="color:var(--gold)">REAL ESTATE</span><small>نظام توزيع ومتابعة الليدز</small></h1><button id="langBtn" class="badge" onclick="toggleLang()" title="Language">EN</button><button id="pjb" class="avb" onclick="hdrPrj()" title="مشاريعي">📁</button><button id="avb" class="avb" onclick="hdrProf()" title="حسابي"></button><span class="badge" id="role">…</span><button class="badge" style="border:0;cursor:pointer;font:inherit" onclick="logout()">خروج</button></div>
  <div id="app"><div class="empty">جاري التحميل…</div></div>
</div>
<script src="../config.js"></script>
<script>window.LF_MODE="admin";window.LF_USER_URL="../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== إعدادات Supabase: من config.js ===== */
// القيم دي بتيجي من ملف config.js (بتعدّلهم هناك مرة واحدة)
const SUPABASE_URL=(window.LF_CONFIG&&window.LF_CONFIG.url)||"PASTE_PROJECT_URL";
const SUPABASE_ANON_KEY=(window.LF_CONFIG&&window.LF_CONFIG.key)||"PASTE_ANON_KEY";

/* ===== طبقة الربط بين الموقع وSupabase (مش لازم تعدّل فيها) ===== */
(function(){
  if(/PASTE_/.test(SUPABASE_URL+SUPABASE_ANON_KEY)&&!window.__LF_TEST){
    window.claude={use:()=>new Promise(()=>{})};
    document.addEventListener("DOMContentLoaded",()=>{const a=document.getElementById("app");if(a)a.innerHTML='<div class="card" style="max-width:420px;margin:30px auto;text-align:center"><h3>⚙️ لسه مفيش إعدادات</h3><p class="m">افتح ملف <b>config.js</b> وحط رابط Supabase والمفتاح (README خطوة 3).</p></div>'});
    return;
  }
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const T="docs";let uid="",ready;const gate=new Promise(r=>ready=r);
  const stores={},subs={},started={};
  const gid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,"").slice(0,20);
  const clone=d=>d===undefined?undefined:JSON.parse(JSON.stringify(d));
  const emit=c=>(subs[c]||[]).forEach(f=>f());
  const sub=(c,f)=>(subs[c]=subs[c]||[]).push(f);
  async function load(c){
    const m=stores[c]=new Map();let from=0;
    for(;;){
      const {data,error}=await sb.from(T).select("id,data").eq("collection",c).range(from,from+999);
      if(error)throw error;data.forEach(r=>m.set(r.id,r.data));
      if(data.length<1000)break;from+=1000;
    }
  }
  function start(c){
    if(started[c])return started[c];
    return started[c]=(async()=>{
      await load(c);
      sb.channel("c-"+c).on("postgres_changes",{event:"*",schema:"public",table:T,filter:"collection=eq."+c},p=>{
        if(p.eventType==="DELETE")stores[c].delete(p.old.id);else stores[c].set(p.new.id,p.new.data);
        emit(c);
      }).subscribe();
    })();
  }
  const local=(c,id,d)=>{(stores[c]=stores[c]||new Map()).set(id,d);emit(c)};
  function coll(c){
    return {
      doc(id){
        id=id||gid();
        return {id,
          async set(d){const {error}=await sb.from(T).upsert({collection:c,id,data:d});if(error)throw error;local(c,id,d)},
          async update(p){const {error}=await sb.rpc("merge_doc",{c,i:id,patch:p});if(error)throw error;local(c,id,{...((stores[c]&&stores[c].get(id))||{}),...p})},
          async delete(){const {error}=await sb.from(T).delete().eq("collection",c).eq("id",id);if(error)throw error;stores[c]&&stores[c].delete(id);emit(c)},
          onSnapshot(cb,err){sub(c,()=>{if(!stores[c])return;const d=stores[c].get(id);cb({exists:d!==undefined,data:()=>clone(d)})});start(c).then(()=>emit(c)).catch(err||(()=>{}))}
        };
      },
      async add(d){const r=this.doc();await r.set(d);return r},
      onSnapshot(cb,err){sub(c,()=>{if(!stores[c])return;cb({docs:[...stores[c]].map(([id,d])=>({id,data:()=>clone(d)}))})});start(c).then(()=>emit(c)).catch(err||(()=>{}))}
    };
  }
  const db={collection:coll,doc:p=>{const [c,i]=p.split("/");return coll(c).doc(i)}};
  const user={id:async()=>uid,
    canEdit:async()=>{const {data}=await sb.from("profiles").select("is_admin").eq("id",uid).maybeSingle();return !!(data&&data.is_admin)},
    approved:async()=>{const {data}=await sb.from("profiles").select("approved,is_admin").eq("id",uid).maybeSingle();return !!(data&&(data.approved||data.is_admin))},
    profiles:async()=>{const {data,error}=await sb.from("profiles").select("id,approved,is_admin");if(error)throw error;return data},
    setApproved:async(id,v)=>{const {error}=await sb.from("profiles").update({approved:!!v}).eq("id",id);if(error)throw error},
    setTeamAccess:async(id,role,teamMembers)=>{const {data,error}=await sb.rpc("admin_set_team_access",{target_user:id,new_role:role,allowed_members:teamMembers});if(error)throw error;return data}};
  const downloads={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:/\.ics$/i.test(filename)?"text/calendar;charset=utf-8":"text/csv;charset=utf-8"}));a.download=filename;a.click()}};
  // توليد الشخصيات: بينادي Supabase Edge Function "generate-avatars" (المفتاح عليها هي بس)
  const avatars={
    generate:async force=>{const {data,error}=await sb.functions.invoke("generate-avatars",{body:{force:!!force}});if(error){let m=error.message;try{const j=await error.context.json();m=j.error==="rate_limit"?"وصلت للحد اليومي، جرّب بكرة":(j.error||m)}catch(_){}throw new Error(m)}return data},
    remove:async()=>{const {error}=await sb.functions.invoke("generate-avatars",{body:{action:"remove"}});if(error)throw error}
  };
  // الفويس فيدباك: ملفات الصوت في Storage خاص (bucket "voice")، وبنشغّلها بروابط مؤقتة
  const voice={
    put:async(path,blob)=>{const {error}=await sb.storage.from("voice").upload(path,blob,{contentType:blob.type||"audio/webm",upsert:false});if(error)throw error;return path},
    url:async path=>{const {data,error}=await sb.storage.from("voice").createSignedUrl(path,3600);if(error)throw error;return data.signedUrl},
    remove:async path=>{const {error}=await sb.storage.from("voice").remove([path]);if(error)throw error}
  };
  window.claude={use:async n=>{await gate;return {db,user,downloads,avatars,voice,sample:null}[n]||null}};
  window.logout=()=>sb.auth.signOut().then(()=>location.reload());

  const S="width:100%;margin-bottom:8px;padding:11px 12px;border-radius:12px;border:1px solid #3d3217;background:#0a0a0a;color:#f6f1e3;font:inherit";
  function showLogin(){
    const o=document.createElement("div");
    o.style.cssText="position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#0a0a0a;padding:16px";
    o.innerHTML=`<div style="width:100%;max-width:340px;background:#14130f;border:1px solid #3d3217;border-radius:22px;padding:22px;color:#f6f1e3;font-family:Cairo,Tahoma,sans-serif;direction:rtl">
      <h2 style="margin:0 0 4px;letter-spacing:1px">OGEIDA <span style="color:#fcd34d">REAL ESTATE</span></h2>
      <p style="color:#a39d8c;margin:0 0 14px">${window.LF_MODE==='admin'?'لوحة الأدمن: دخول الإدارة فقط':'تطبيق الموظفين'}</p>
      <input id="lE" type="email" placeholder="الإيميل" style="${S}"><input id="lP" type="password" placeholder="الباسورد (6 حروف على الأقل)" style="${S}">
      <div id="lM" style="color:#f43f5e;min-height:20px;font-size:13px;margin-bottom:6px"></div>
      <button id="lI" style="${S};background:#fcd34d;color:#1a1400;font-weight:700;border:0;border-radius:99px;cursor:pointer">دخول</button>
      ${window.LF_MODE==='admin'?'':`<button id="lU" style="${S};cursor:pointer;margin:0">حساب جديد</button>`}</div>`;
    document.body.appendChild(o);
    const go=async up=>{
      const email=o.querySelector("#lE").value.trim(),password=o.querySelector("#lP").value,m=o.querySelector("#lM");
      if(!email||!password){m.textContent="اكتب الإيميل والباسورد";return}
      const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
      if(r.error){m.textContent=r.error.message;return}
      if(!r.data.session){m.style.color="#fcd34d";m.textContent="اتبعتلك إيميل تأكيد. أكّده وبعدين ادخل";return}
      uid=r.data.session.user.id;o.remove();ready();
    };
    o.querySelector("#lI").onclick=()=>go(false);const _u=o.querySelector("#lU");if(_u)_u.onclick=()=>go(true);
  }
  sb.auth.getSession().then(({data})=>{if(data.session){uid=data.session.user.id;ready()}else showLogin()});
})();

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

}

const pvis=()=>PJ.filter(p=>p.owner===ME()||p.vis==="all");
async function pjAdd(){

const pjUp=(id,p)=>db.collection("projects").doc(id).update({...p,upd:Date.now()}).catch(()=>{gmsg="تعذّر الحفظ"});
const pjGet=id=>PJ.find(x=>x.id===id)||{tasks:[]};
function pjTask(id,i,v){return pjUp(id,{tasks:pjGet(id).tasks.map((x,k)=>k===i?{...x,done:v}:x)})}
function pjAddTask(id){const v=(document.getElementById("nt"+id).value||"").trim();if(v)return pjUp(id,{tasks:[...pjGet(id).tasks,{t:v,done:false}]})}

let vaultFile=null,vaultRecorder=null,vaultChunks=[],vaultRecStream=null,vaultAudioBlob=null;
function vaultPickFile(file){if(!file)return;if(file.size>8*1024*1024){toast("الملف أكبر من 8MB");return}vaultFile=file;const e=document.getElementById("vaultFileName");if(e)e.textContent=file.name;}
async function vaultRecStart(){if(vaultRecorder)return;try{vaultRecStream=await navigator.mediaDevices.getUserMedia({audio:true});vaultChunks=[];vaultRecorder=new MediaRecorder(vaultRecStream);vaultRecorder.ondataavailable=e=>{if(e.data&&e.data.size)vaultChunks.push(e.data)};vaultRecorder.onstop=()=>{vaultAudioBlob=new Blob(vaultChunks,{type:vaultRecorder?.mimeType||"audio/webm"});vaultRecStream?.getTracks().forEach(t=>t.stop());vaultRecStream=null;vaultRecorder=null;toast("تم تسجيل الفويس، اضغط حفظ الملاحظة")};vaultRecorder.start();toast("التسجيل بدأ");}catch(e){toast("اسمح باستخدام المايك من إعدادات المتصفح")}}

function vaultView(){const mine=vaultItems.filter(x=>x.owner===ME()).sort((a,b)=>(b.at||0)-(a.at||0));return `<div class="card"><h3>📁 مشاريعي — المخزن الشخصي</h3><p class="m">ملاحظات وأفكار وتذكيرات خاصة بحسابك. يمكنك إرفاق صورة أو ملف وتسجيل فويس.</p><input id="vaultTitle" placeholder="عنوان الملاحظة أو المجلد" style="width:100%;margin-bottom:8px"><textarea id="vaultText" placeholder="اكتب تفاصيل المشروع أو تذكيرك هنا"></textarea><div class="row" style="margin-top:8px"><label class="btn g">🖼️ إرفاق ملف<input type="file" hidden accept="image/*,.pdf,.doc,.docx" onchange="vaultPickFile(this.files[0])"></label><span id="vaultFileName" class="m">${vaultFile?esc(vaultFile.name):"لا يوجد ملف"}</span><button class="btn g" onclick="vaultRecStart()">🎙 تسجيل فويس</button><button class="btn g" onclick="vaultRecStop()">⏹ إيقاف التسجيل</button><button class="btn" onclick="vaultSave()">💾 حفظ</button></div></div>${mine.map(v=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(v.title||"ملاحظة")}</b><span class="m">${new Date(v.at).toLocaleString("ar-EG")}</span></div><p style="white-space:pre-wrap">${esc(v.text||"")}</p>${v.filePath?`<div class="row"><button class="btn g" onclick="vaultOpenFile('${v.id}')">📎 فتح المرفق</button></div>`:""}${v.voicePath?`<div class="row"><button class="btn g" onclick="vaultPlayVoice('${v.id}',this)">▶ تشغيل الفويس</button></div>`:""}<div class="row"><button class="btn g" onclick="vaultEdit('${v.id}')">تعديل</button><button class="btn g" onclick="vaultDelete('${v.id}')">حذف</button></div></div>`).join("")||`<div class="card empty">المخزن فاضي. اكتب أول ملاحظة.</div>`}`}
async function vaultOpenFile(id){const v=vaultItems.find(x=>x.id===id);if(!v?.filePath||!VC)return;try{const u=await VC.url(v.filePath);window.open(u,"_blank","noopener")}catch(e){toast("تعذّر فتح المرفق")}}

async function vaultSave(id){const title=(document.getElementById("vaultTitle")?.value||"").trim(),body=(document.getElementById("vaultText")?.value||"").trim();if(!title&&!body&&!vaultFile&&!vaultAudioBlob)return toast("اكتب عنوانًا أو ملاحظة");const t=Date.now(),d={owner:ME(),title,text:body,at:t,upd:t};try{if(vaultFile){if(!VC||!VC.put)throw new Error("storage");const ext=(vaultFile.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").slice(0,8),path=ME()+"/vault-"+t+"."+ext;d.filePath=await VC.put(path,vaultFile);d.fileName=vaultFile.name;d.fileType=vaultFile.type;vaultFile=null}if(vaultAudioBlob){if(!VC||!VC.put)throw new Error("storage");const ext=/mp4/.test(vaultAudioBlob.type)?"m4a":"webm",path=ME()+"/vault-voice-"+t+"."+ext;d.voicePath=await VC.put(path,vaultAudioBlob);d.voiceMime=vaultAudioBlob.type;vaultAudioBlob=null}if(id)await db.collection("vault").doc(id).update(d);else await db.collection("vault").add(d);toast("اتحفظت الملاحظة");render(1)}catch(e){toast("تعذّر الحفظ؛ تأكد من إعدادات Storage")}}

let ringing="",ringT=0,inventoryForm=false;
function toast(t){const e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fcd34d;color:#1a1400;padding:8px 16px;border-radius:99px;z-index:120;font-weight:700";document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
let alarmVolume=Number(localStorage.getItem("lf_alarm_volume")||0.35);
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)();[1046,1318,1568].forEach((f,i)=>{const o=A.createOscillator(),g=A.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(0.0001,A.currentTime+i*.13);g.gain.exponentialRampToValueAtTime(Math.max(.001,alarmVolume*.22),A.currentTime+i*.13+.025);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+i*.13+.19);o.start(A.currentTime+i*.13);o.stop(A.currentTime+i*.13+.2)});setTimeout(()=>A.close(),650)}catch(e){}}
function setAlarmVolume(v){alarmVolume=Math.max(0,Math.min(1,+v||0));try{localStorage.setItem("lf_alarm_volume",String(alarmVolume))}catch(e){}}

async function alarmSet(id,t){
  if(!(t>Date.now())){toast("اختار وقت جاي");return}
  try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
  try{await db.collection("leads").doc(id).update({alarm:t,rung:false});toast("⏰ اتضبط المنبه")}catch(e){toast("تعذّر الحفظ")}
}
const alarmIn=(id,h)=>alarmSet(id,Date.now()+h*36e5);
const alarmAt=(id,v)=>v&&alarmSet(id,new Date(v).getTime());
async function alarmClear(id){try{await db.collection("leads").doc(id).update({alarm:0,rung:false})}catch(e){}}
function alarmIcs(id){
  const l=leads.find(x=>x.id===id);if(!l||!l.alarm)return;
  const f=t=>new Date(t).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""),c=s=>String(s||"").replace(/[,;\n\\]/g," ");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LeadFlow//AR","BEGIN:VEVENT","UID:"+id+"-"+l.alarm+"@leadflow","DTSTAMP:"+f(Date.now()),"DTSTART:"+f(l.alarm),"DTEND:"+f(l.alarm+9e5),"SUMMARY:"+c("متابعة: "+l.name),"DESCRIPTION:"+c("اتصل بـ "+l.phone+(l.note?" - "+l.note:"")),"BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:"+c("متابعة "+l.name),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  claude.use("downloads").then(d=>d&&d.save({filename:"followup-"+id.slice(0,6)+".ics",data:ics})).catch(()=>{});
}
function alarmBox(l){
  const a=l.alarm&&!l.rung?l.alarm:0,id=l.id,q=(h,t)=>`<button class="btn g" style="padding:5px 10px;font-size:12px" onclick="alarmIn('${id}',${h})">${t}</button>`;
  return `<div class="alm"><div class="row" style="justify-content:space-between"><b>⏰ منبه المتابعة</b>${a?`<span class="t hot">${new Date(a).toLocaleString("ar-EG",{weekday:"short",hour:"numeric",minute:"2-digit"})}</span>`:l.rung?`<span class="t none">رنّ ✓</span>`:""}</div><div class="row" style="margin-top:6px">${q(1,"ساعة")}${q(2,"ساعتين")}${q(4,"4 ساعات")}${q(24,"24 ساعة")}<input type="datetime-local" style="min-width:0;flex:1" onchange="alarmAt('${id}',this.value)"></div>${a?`<div class="row" style="margin-top:6px"><button class="btn g" style="padding:5px 10px;font-size:12px" onclick="alarmIcs('${id}')">📅 أضف لتقويم الموبايل</button><button class="btn g" style="padding:5px 10px;font-size:12px" onclick="alarmClear('${id}')">إلغاء المنبه</button></div>`:""}</div>`;
}

async function dist(mode){

  const reset=mode==="cold";S=shuf(S.slice());
  const cnt={};ids.forEach(u=>cnt[u]=leads.filter(l=>l.owner===u&&!S.includes(l)).length);

async function addL(){
  const rows=document.getElementById("paste").value.split("\n");let n=0;
  for(const r of rows){const p=r.split(/[,،\t]/).map(x=>x.trim());if(p[0]&&p[1]){await db.collection("leads").add({name:p[0],phone:p[1],source:p[2]||"",owner:"",res:"",act:"",manual:"",note:"",follow:"",bid:"manual",bn:"إضافة يدوية",upd:0,at:Date.now()+n++})}}
}
async function rmM(u){if(confirm("إزالة العضو؟ ليدزه هترجع غير موزّعة")){for(const l of leads.filter(l=>l.owner===u))await db.collection("leads").doc(l.id).update({owner:""});await db.collection("members").doc(u).delete()}}
function filteredAdminLeads(){return leads.filter(l=>(!dueOnly||due(l))&&(!flt||temp(l)===flt))}
function exp(){
  const L=filteredAdminLeads();
  if(!L.length){toast("لا توجد نتائج للتنزيل");return}
  const h=["م","الاسم","الرقم","المصدر","المسؤول","المشروع","الكول","الأكشن","الدرجة","متابعة","ملاحظات"];
  const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
  const r=L.map((l,i)=>[i+1,l.name,l.phone,l.source,l.owner?mname(l.owner):"",l.projectInterest||l.proj||"",l.res,l.act,temp(l),l.follow,l.note].map(q).join(","));
  claude.use("downloads").then(d=>d&&d.save({filename:"leads-filtered.csv",data:"\ufeff"+[h.map(q).join(","),...r].join("\n")})).catch(()=>toast("تعذّر تنزيل الملف"));
}
(async()=>{
  try{
    db=await claude.use("db");const user=await claude.use("user");try{AVG=await claude.use("avatars")}catch(e){AVG=null}try{VC=await claude.use("voice")}catch(e){VC=null}
    if(!db||!user){document.getElementById("app").innerHTML=`<div class="card empty">سجّل دخولك في claude.ai عشان تفتح الصفحة</div>`;return}
    me=await user.id();isAdmin=await user.canEdit();USR=user;
    if(MODE==="admin"&&!isAdmin){GATE="noadmin";render(1);return}
    if(MODE==="user"&&isAdmin){GATE="isadmin";render(1);return}
    const okp=user.approved?await user.approved():true;
    if(!isAdmin&&!okp){PEND=true;render(1);setInterval(async()=>{try{if(await user.approved())location.reload()}catch(e){}},8000);return}
    db.collection("members").onSnapshot(s=>{members={};s.docs.forEach(d=>members[d.id]=d.data());render()},()=>{});
    db.doc("settings/config").onSnapshot(s=>{if(s.exists)cfg={...cfg,...s.data()};render()},()=>{});
    db.collection("voices").onSnapshot(s=>{voices=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
    db.collection("feedback").onSnapshot(s=>{feedbackItems=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
    db.collection("group_vault").onSnapshot(s=>{groupVaultItems=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
    db.collection("projects").onSnapshot(s=>{PJ=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.upd||0)-(a.upd||0));render()},()=>{});
    db.collection("vault").onSnapshot(s=>{vaultItems=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
    db.collection("avatars").onSnapshot(s=>{AVT={};s.docs.forEach(d=>AVT[d.id]=d.data());render()},()=>{});
    db.collection("calls").onSnapshot(s=>{calls=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.at-b.at);render()},()=>{});
    db.collection("updates").onSnapshot(s=>{ups=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));render()},()=>{});
    if(isAdmin&&user.profiles){loadProfs();setInterval(loadProfs,15000)}
    db.collection("leads").onSnapshot(s=>{leads=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));render()},()=>{});
  }catch(e){document.getElementById("app").innerHTML=`<div class="card empty">تعذّر تحميل البيانات</div>`}
})();
</script>
